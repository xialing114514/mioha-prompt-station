name: 问题反馈
description: 报告可复现的软件问题
title: "[问题] "
body:
  - type: markdown
    attributes:
      value: "请先查阅使用指南和已有问题。不要提交 Key、Token、个人数据库或私人对话。"
  - type: input
    id: version
    attributes:
      label: 软件版本
      description: 可在设置中查看
      placeholder: 例如 0.2.2
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: 涉及模块
      options:
        - 安装或启动
        - 内置 AI
        - 提示词或角色配方
        - 模型与 LoRA
        - NeoForge 生图
        - ComfyUI 生图
        - NovelAI
        - WD14 或图片参数
        - Skill
        - AI Bridge
        - 内容模式
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: "1. 打开…
2. 选择…
3. 点击…"
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 预期与实际结果
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境与补充材料
      description: Windows、引擎、底模／LoRA、工作流类型、脱敏截图或必要的错误文本
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前确认
      options:
        - label: 已检查并移除 Key、Token 和私人资料
          required: true
